name: taskflow-ai

x-env: &default-env
  env_file:
    - .env

services:
  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-taskflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-taskflow}
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.5
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ---------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3300:3000"
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    <<: *default-env
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tasks-service:
        condition: service_started
      ai-service:
        condition: service_started
      otel-collector:
        condition: service_started

  tasks-service:
    build:
      context: .
      dockerfile: apps/tasks-service/Dockerfile
    <<: *default-env
    restart: unless-stopped
    ports:
      - "${TASKS_SERVICE_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    <<: *default-env
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-3002}:3002"
    depends_on:
      qdrant:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  notifications-service:
    build:
      context: .
      dockerfile: apps/notifications-service/Dockerfile
    <<: *default-env
    restart: unless-stopped
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT:-3003}:3003"
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_NOTIFICATIONS_URL: ${NEXT_PUBLIC_NOTIFICATIONS_URL:-http://localhost:3003}
    <<: *default-env
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3100}:3100"
    depends_on:
      - gateway

volumes:
  pg_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
