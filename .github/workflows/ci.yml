name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Dummy values so build-time env access doesn't fail — real
          # secrets are injected at deploy time via Kubernetes.
          ANTHROPIC_API_KEY: sk-ant-dummy
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_NOTIFICATIONS_URL: http://localhost:3003

  docker:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        app: [web, gateway, tasks-service, ai-service, notifications-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: taskflow-ai/${{ matrix.app }}:ci
