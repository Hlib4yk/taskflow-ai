apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: taskflow-ai
spec:
  # Single replica by design: Socket.IO connections are pinned to whichever
  # pod accepted them, but the RabbitMQ event that triggers a broadcast can
  # land on any pod. Scaling this past 1 replica needs a shared adapter
  # (e.g. the Socket.IO Redis adapter) so every pod can fan events out to
  # every connected client — not wired up here to keep the demo honest.
  replicas: 1
  selector:
    matchLabels: { app: notifications-service }
  template:
    metadata:
      labels: { app: notifications-service }
    spec:
      containers:
        - name: notifications-service
          image: taskflow-ai/notifications-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3003 }]
          envFrom:
            - configMapRef: { name: taskflow-config }
          env:
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: RABBITMQ_URL } }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: taskflow-ai
spec:
  selector: { app: notifications-service }
  ports: [{ port: 3003, targetPort: 3003 }]
