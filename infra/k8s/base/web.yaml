apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: taskflow-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: taskflow-ai/web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3100 }]
          readinessProbe:
            httpGet: { path: /login, port: 3100 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: 3100 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: taskflow-ai
spec:
  selector: { app: web }
  ports: [{ port: 3100, targetPort: 3100 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: taskflow-ai
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
