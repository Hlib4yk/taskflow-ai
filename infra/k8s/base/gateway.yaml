apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: taskflow-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: taskflow-ai/gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: taskflow-config }
          env:
            - name: GATEWAY_DATABASE_URL
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: GATEWAY_DATABASE_URL } }
            - name: JWT_ACCESS_SECRET
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: JWT_ACCESS_SECRET } }
            - name: JWT_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: JWT_REFRESH_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: taskflow-ai
spec:
  selector: { app: gateway }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: taskflow-ai
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
