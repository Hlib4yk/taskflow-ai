apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Single-node dev cluster (minikube/kind): one replica each is enough, and
# app images are usually built straight into the cluster's local docker
# daemon rather than pulled from a registry.
patches:
  - target:
      kind: Deployment
      name: "gateway|tasks-service|ai-service|web"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: "gateway|tasks-service|ai-service|web|notifications-service"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
