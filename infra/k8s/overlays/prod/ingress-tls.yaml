# Strategic-merge patch adding TLS + cert-manager to the base ingress.
# Requires cert-manager and a ClusterIssuer named "letsencrypt-prod" —
# swap for whatever your cluster actually uses.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-ingress
  namespace: taskflow-ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [app.taskflow.ai, api.taskflow.ai, realtime.taskflow.ai]
      secretName: taskflow-tls
