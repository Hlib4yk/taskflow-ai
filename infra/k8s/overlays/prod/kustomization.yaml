apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: taskflow-ai/gateway
    newName: ghcr.io/your-org/taskflow-ai-gateway
    newTag: latest
  - name: taskflow-ai/tasks-service
    newName: ghcr.io/your-org/taskflow-ai-tasks-service
    newTag: latest
  - name: taskflow-ai/ai-service
    newName: ghcr.io/your-org/taskflow-ai-ai-service
    newTag: latest
  - name: taskflow-ai/notifications-service
    newName: ghcr.io/your-org/taskflow-ai-notifications-service
    newTag: latest
  - name: taskflow-ai/web
    newName: ghcr.io/your-org/taskflow-ai-web
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: "gateway|web"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - path: ingress-tls.yaml
